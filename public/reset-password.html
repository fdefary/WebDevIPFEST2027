<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Reset Password - IPFEST 2027</title>
	<link rel="icon" href="static/images/ipfest_2027_logo.png">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="static/css/reset-password.css">
</head>
<body class="reset-password-page">
	<nav class="reset-header" aria-label="Main navigation">
		<div class="reset-header-inner">
			<a href="login.html" class="reset-brand" aria-label="Back to IPFEST sign in">
				<img src="static/images/ipfest_2027_logo.png" alt="">
				<img src="static/images/ipfest_2027_text.png" alt="IPFEST 2027">
			</a>
		</div>
	</nav>
	<main class="reset-shell">
		<div id="alertContainer" class="reset-alert" aria-live="polite"></div>
		<section class="reset-panel" aria-labelledby="reset-title">
			<h1 id="reset-title">Reset your password</h1>
			<p class="reset-copy">Enter the email address linked to your account and we’ll send you a password reset link.</p>
			<form id="reset-password" class="needs-validation" novalidate>
				<div class="reset-field">
					<label for="passwordResetEmail" class="form-label">Email address</label>
					<input type="email" id="passwordResetEmail" class="form-control" placeholder="name@example.com" autocomplete="email" required>
					<div class="invalid-feedback">Please enter a valid email address.</div>
				</div>
				<button type="submit" class="reset-submit">Send reset link</button>
			</form>
			<a href="login.html" class="reset-back">Back to sign in</a>
		</section>
	</main>
	<script src="dist/index.bundle.js"></script>
	<script src="dist/resetPassword.bundle.js"></script>
	<script src="static/js/validation.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
