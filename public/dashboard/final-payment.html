<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Final Payment - IPFEST 2027</title>
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<meta content="" name="keywords">
	<meta content="" name="description">
	<link rel="icon" href="../static/images/ipfest_2027_logo.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/lib/animate/animate.min.css" rel="stylesheet">
	<link href="../static/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
	<link href="../static/lib/lightbox/css/lightbox.min.css" rel="stylesheet">
	<link href="../static/css/bootstrap.min.css" rel="stylesheet">
	<link href="../static/css/style.css" rel="stylesheet">
	<link href="../static/css/grand-theme.css" rel="stylesheet">
	<link href="../static/css/grand-subpage.css" rel="stylesheet">
	<link href="../static/css/final-payment-grand.css" rel="stylesheet">
	<link rel="stylesheet" href="../static/css/navbar-unified.css">
</head>
<body class="event-page fp-page">
	<!-- Lingkaran animasi latar (aturan .circles ada di grand-subpage.css) -->
	<ul class="circles" aria-hidden="true">
		<li></li><li></li><li></li><li></li><li></li>
		<li></li><li></li><li></li><li></li><li></li>
		<li></li><li></li><li></li><li></li><li></li>
		<li></li><li></li><li></li><li></li><li></li>
		<li></li><li></li><li></li><li></li><li></li>
	</ul>

	<!-- Navbar -->
	<div class="container-fluid p-0 event-nav-layer">
		<nav class="navbar event-navbar navbar-expand-lg navbar-dark bg-transparent fixed-top px-4 px-lg-5 py-3 py-lg-0">
			<a href="" class="navbar-brand p-0 d-flex align-items-center gap-3">
				<img src="../static/images/ipfest_2027_logo.png" alt="IPFEST 2027 logo">
				<img src="../static/images/ipfest_2027_text.png" alt="IPFEST 2027">
			</a>
			<div class="ms-auto d-flex align-items-center">
				<button class="btn btn-light border border-primary rounded-pill text-primary py-2 px-4" id="logout-btn">Log Out</button>
			</div>
		</nav>
	</div>

	<main class="container-fluid py-5 fp-stage">
		<div class="container d-flex py-5">
			<section class="col-lg-9 col-md-11 col-sm-12 mx-auto">

				<!-- Judul halaman -->
				<header class="fp-hero text-center">
					<span class="fp-eyebrow">Final Round</span>
					<h1 class="fp-title">Final Payment</h1>
					<p class="fp-subtitle">Upload your payment proof and choose your hospitality package.</p>
					
				</header>

				<div class="dashboard-panel fp-panel">
					<form id="final-payment-upload">

						<!-- Leader -->
						<div class="fp-card" id="leader-final-pay-form">
							<div class="fp-card-head">
								<div class="fp-avatar" aria-hidden="true"><i class="bi bi-award-fill"></i></div>
								<div>
									<span class="fp-role">Team Leader</span>
									<h4 class="fp-card-title">Leader</h4>
								</div>
							</div>

							<div class="row g-3">
								<div class="col-md-6 col-12">
									<label for="final-leader-payment-submit" class="form-label">Upload payment proof</label>
									<input type="file" name="final-leader-payment-submit" id="final-leader-payment-submit" class="form-control" placeholder="Your Payment Proof" aria-label="Final Payment Proof">
								</div>
								<div class="col-md-6 col-12">
									<label for="leader-hospitality-type" class="form-label">Hospitality</label>
									<select name="leader-hospitality-type" id="leader-hospitality-type" class="form-select" required>
										<option value="Full Hospitality">Full Hospitality</option>
										<option value="Excluding Accommodation">Excluding Accommodation</option>
									</select>
								</div>
								<div class="col-md-4 col-12">
									<label for="leader-payment-type" class="form-label">Payment Scheme</label>
									<select name="leader-payment-type" id="leader-payment-type" class="form-select" required>
										<option value="Full">Full Payment</option>
										<option value="DP" selected>Down Payment</option>
									</select>
								</div>
								<div class="col-md-4 col-12">
									<label for="leader-payment-method" class="form-label">Payment Method</label>
									<select name="leader-payment-method" id="leader-payment-method" class="form-select" required>
										<option value="Gopay">Gopay</option>
										<option value="Bank BCA">Bank BCA</option>
										<option value="Paypal">Paypal</option>
									</select>
								</div>
								<div class="down-payment-category-parent col-md-4 col-12">
									<label for="leader-down-payment-category" class="form-label">Category</label>
									<select name="leader-down-payment-category" id="leader-down-payment-category" class="form-select" disabled>
										<option value="First">First Payment</option>
										<option value="Last" selected>Last Payment</option>
									</select>
								</div>
							</div>
						</div>

						<!-- Member (diisi script) -->
						<div class="members-final-pay-form mt-3"></div>

						<!-- Persetujuan -->
						<div class="form-check fp-agree mt-4">
							<input class="form-check-input" type="checkbox" value="" id="have-read" required>
							<label class="form-check-label" for="have-read">
								We have read the <a href="https://drive.google.com/file/d/1D-Yj2-X-7yXGZNcrtEVnxp4ztn8v52CG/view?usp=sharing" class="fp-link" target="_blank" rel="noopener">Finalist Payment Rules</a>.
							</label>
							<div class="invalid-feedback">You must agree before submitting.</div>
						</div>

						<div class="d-flex justify-content-end">
							<button type="submit" class="btn btn-light border border-primary rounded-pill text-primary py-2 px-5 mt-4 fp-submit">
								<span>Submit</span> <i class="bi bi-arrow-right-short"></i>
							</button>
						</div>
					</form>
				</div>
			</section>
		</div>
	</main>

	<script>
		// Tampilkan nama file terpilih di bawah input (hanya tampilan)
		document.addEventListener('change', function (e) {
			var input = e.target;
			if (!input.matches('.fp-stage input[type="file"]')) return;
			var hint = input.parentElement.querySelector('.fp-file-name');
			if (!hint) {
				hint = document.createElement('small');
				hint.className = 'fp-file-name';
				input.insertAdjacentElement('afterend', hint);
			}
			hint.textContent = input.files.length ? '✓ ' + input.files[0].name : '';
		});
	</script>
</body>
</html>
