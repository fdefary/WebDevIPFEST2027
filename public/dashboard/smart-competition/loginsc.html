<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login - Smart Competition - IPFEST 2027</title>
	<link rel="icon" href="../../static/images/ipfest_2027_logo.png">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../../static/css/login.css">
	<link rel="stylesheet" href="../../static/css/login-animations.css">
</head>
<body>
	<main class="login-layout">
		<section class="login-form-panel" aria-labelledby="login-title">
			<a href="../../index.html" class="login-brand" aria-label="IPFEST home">
				<img src="../../static/images/ipfest_2027_logo.png" alt="">
				<img src="../../static/images/ipfest_2027_text.png" alt="IPFEST 2027">
			</a>
			<div class="login-content">
				<div id="alertContainer" aria-live="polite"></div>
				<header class="login-heading">
					<h1 id="login-title">Welcome, <span>folks!</span></h1>
					<p>Sign in to your Smart Competition account</p>
				</header>
				<div id="failLoginAlert" aria-live="polite"></div>
				<form id="login-user">
					<div class="form-floating login-field">
						<input type="email" class="form-control" id="email" placeholder="name@example.com" autocomplete="email" required>
						<label for="email">Email address</label>
					</div>
					<div class="form-floating login-field">
						<input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" required>
						<label for="password">Password</label>
					</div>
					<div class="login-links">
						<a href="../../reset-password.html">Forgot Password?</a>
						<a href="../../register.html" id="registerLink">Sign up</a>
					</div>
					<button class="login-submit" type="submit">Sign in</button>
				</form>
			</div>
			<img src="../../static/images/Oii%20lompat.PNG" alt="" class="login-mascot" aria-hidden="true">
			<footer class="login-footer"></footer>
		</section>
		<div class="login-image" aria-hidden="true"></div>
	</main>

	<script src="../../dist/index.bundle.js"></script>
	<script src="../../dist/login_sc.bundle.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
