<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Entrepreneurship - IPFEST 2026</title>
	<meta content="width=device-width, initial-scale=1.0" name="viewport">
	<meta content="" name="keywords">
	<meta content="" name="description">
	<link rel="icon" href="../static/images/ipfest_2026_logo.svg">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet"> 
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"/>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link href="../static/lib/animate/animate.min.css" rel="stylesheet">
	<link href="../static/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
	<link href="../static/lib/lightbox/css/lightbox.min.css" rel="stylesheet">
	<link href="../static/css/bootstrap.min.css" rel="stylesheet">
	<link href="../static/css/style.css" rel="stylesheet">
    <style>
        /* Tambahan styling agar tabel lebih rapi */
        .status-select { min-width: 120px; border-radius: 20px; font-size: 0.85rem; }
        .dashboard-panel { background: #fff; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table thead { background-color: #f8f9fa; }
        .btn-view-file { font-size: 0.75rem; border-radius: 5px; }
    </style>
    <link href="../static/css/merchmanager.css" rel="stylesheet">
</head>

<body class="dashboard-theme">
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <div class="container-fluid p-0">
        <nav class="navbar navbar-expand-lg fixed-top navbar-light px-4 px-lg-5 py-3 py-lg-0 dashboard-navbar">
            <a href="" class="navbar-brand p-0 d-flex align-items-center gap-3">
                <img src="../static/images/ipfest_2026_logo.svg" alt="Logo" width="60">
                <img src="../static/images/ipfest_2026_text.svg" alt="Text" width="80">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars"></span>
            </button>
            <div class="collapse navbar-collapse py-3 py-lg-0" id="navbarCollapse">
                <div class="navbar-nav ms-auto">
                    <ul class="nav nav-tabs border-0" id="nav-tab" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active border-0" id="nav-home-tab" data-bs-toggle="tab" data-bs-target="#nav-home" type="button">Dashboard</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link border-0" id="nav-merch-tab" data-bs-toggle="tab" data-bs-target="#nav-merch" type="button">Merchandise</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link border-0" id="nav-profile-tab" data-bs-toggle="tab" data-bs-target="#nav-profile" type="button">Verification</button>
                        </li>
                    </ul>
                    <button class="btn btn-outline-danger rounded-pill px-4 ms-lg-4" id="logout-btn">Log Out</button>
                </div>
            </div>
        </nav>
    </div>

    <main class="container-fluid py-5 mt-5">
        <div class="container py-5">
            <div class="tab-content" id="nav-tabContent">
                
                <div class="tab-pane fade show active" id="nav-home" role="tabpanel">
                    <div class="row g-4">
                        <div class="col-md-4">
                            <div class="card shadow p-4 text-center border-0">
                                <i class="bi bi-cart-check text-primary fs-1"></i>
                                <p class="mt-2 mb-0">Merch Revenue</p>
                                <h3 id="total-merch-revenue">Rp 0</h3>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card shadow p-4 text-center border-0">
                                <i class="bi bi-hourglass-split text-warning fs-1"></i>
                                <p class="mt-2 mb-0">Pending Orders</p>
                                <h3 id="pending-orders-count">0</h3>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="nav-merch" role="tabpanel">
                    <div class="dashboard-panel">
                        <h4 class="mb-4 text-primary fw-bold">Merchandise Order Review</h4>
                        <form id="merch-status-form">
                            <div class="table-responsive" style="max-height: 60vh;">
                                <table class="table table-hover">
                                    <thead class="sticky-top bg-white">
                                        <tr>
                                            <th>No.</th>
                                            <th>Customer</th>
                                            <th>Order Details</th>
                                            <th>Total</th>
                                            <th>Files</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="treasury-merch-list">
                                        </tbody>
                                </table>
                            </div>
                            <div class="text-end mt-4">
                                <button type="button" id="export-merch-excel" class="btn btn-primary px-5 rounded-pill">
                                    <i class="bi bi-file-earmark-excel"></i> Export to Excel
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="tab-pane fade" id="nav-profile" role="tabpanel">
                    <div class="dashboard-panel">
                        <p class="text-center">Team verification table goes here...</p>
                    </div>
                </div>

            </div>
        </div>
    </main>

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
	<script src="../static/lib/wow/wow.min.js"></script>
	<script src="../static/lib/easing/easing.min.js"></script>
	<script src="../static/lib/waypoints/waypoints.min.js"></script>
	<script src="../static/lib/counterup/counterup.min.js"></script>
	<script src="../static/lib/owlcarousel/owl.carousel.min.js"></script>
	<script src="../static/lib/lightbox/js/lightbox.min.js"></script>
	<script src="../static/js/main.js"></script>
    <script src="../dist/merchmanager.bundle.js"></script>
</body>
</html>
